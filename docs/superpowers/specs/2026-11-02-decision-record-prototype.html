const sum = (xs) => xs.reduce((a, b) => a + b, 0);
// An option's score for a goal: criteria-weighted mean of its 0–10 scores.
function goalScores(g) {
  const W = sum(g.criteria.map((c) => c.w)) || 1;
  return Object.fromEntries(g.options.map((o) => [o, sum(g.criteria.map((c) => (c.w / W) * (g.scores[o]?.[c.id] ?? 0)))]));
}
function goalWinner(g) {
  const s = goalScores(g);
  return g.options.reduce((best, o) => (best === null || s[o] > s[best] ? o : best), null);
}
// Overall: goal-importance-weighted sum; an option missing from a goal scores 0 there.
function overall(rec, weights) {
  const T = sum(rec.goals.map((g) => weights[g.id] ?? 0)) || 1;
  const per = rec.goals.map((g) => [g, goalScores(g)]);
  return OPTIONS.map((o) => {
    const parts = per.map(([g, s]) => ({ goal: g.id, v: ((weights[g.id] ?? 0) / T) * (s[o.id] ?? 0) }));
    return { id: o.id, parts, total: sum(parts.map((p) => p.v)) };
  }).sort((a, b) => b.total - a.total);
}

const { useState, useRef, useEffect } = React;
const html = htm.bind(React.createElement);
const GOAL_COLORS = ['var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)', 'var(--ink3)'];
const CRIT_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
const fmt = (v) => v.toFixed(1);
const pct = (v, T) => (T ? Math.round((v / T) * 100) : 0);
const optName = (id, pool) => pool.find((o) => o.id === id)?.name ?? id;
const scoreBg = (n) => `rgba(var(--score), ${0.08 + (n / 10) * 0.72})`;
const scoreFg = (n) => (n >= 6 ? 'var(--on-ink)' : 'var(--ink)');
const clone = (x) => JSON.parse(JSON.stringify(x));
let nextId = 1;
const newId = (p) => `${p}${nextId++}`;

// Resize weights[side] across the divider right of weights[i]. Chosen indices absorb the change; with nothing chosen, all the others do.
const MIN_W = 0.5;
function resizeWeights(ws, i, side, delta, chosen) {
  const r = side;
  let pool = chosen.filter((j) => j !== r);
  if (chosen.length && !pool.length) return resizeWeights(ws, i, r === i ? i + 1 : i, delta, chosen);
  if (!chosen.length) pool = ws.map((_, j) => j).filter((j) => j !== r);
  const d = r === i ? delta : -delta;
  const P = pool.reduce((t, j) => t + ws[j], 0);
  const nd = Math.max(MIN_W - ws[r], Math.min(P - MIN_W * pool.length, d));
  const out = [...ws];
  out[r] = ws[r] + nd;
  pool.forEach((j) => { out[j] = P ? ws[j] - (nd * ws[j]) / P : ws[j]; });
  return out.map((w) => Math.round(w * 10) / 10);
}
const angleDelta = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const polar = (r, a) => [100 + r * Math.sin(a), 100 - r * Math.cos(a)];
function arcPath(r0, r1, a0, a1) {
  if (a1 - a0 >= 2 * Math.PI - 1e-6) a1 = a0 + 2 * Math.PI - 1e-4;
  const big = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = polar(r1, a0); const [x1, y1] = polar(r1, a1); const [x2, y2] = polar(r0, a1); const [x3, y3] = polar(r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${big} 0 ${x3} ${y3}Z`;
}

// The app's bar or pie: drag a divider (bar) or a ⇔ handle (pie) to resize; Ctrl/⌘/Shift-click chooses what absorbs it.
function WeightEditor({ items, mode, chosen, onToggle, onClear, onStart, onChange, onSelect, selected, colorOf, height = 84 }) {
  const box = useRef(null);
  const drag = useRef(null);
  const suppress = useRef(false);
  const ws = items.map((x) => x.w);
  const T = ws.reduce((t, w) => t + w, 0) || 1;
  const chosenIdx = items.map((x, j) => (chosen.includes(x.id) ? j : -1)).filter((j) => j >= 0);
  const start = (i, e) => {
    if (e.button) return;
    e.stopPropagation();
    e.currentTarget.setPointerCapture(e.pointerId);
    const r = box.current.getBoundingClientRect();
    const cx = r.left + r.width / 2; const cy = r.top + r.height / 2;
    drag.current = { i, x0: e.clientX, width: r.width, cx, cy, prev: Math.atan2(e.clientX - cx, cy - e.clientY), turned: 0, ws };
    onStart();
  };
  const move = (e) => {
    const d = drag.current;
    if (!d) return;
    let frac;
    if (mode === 'bar') frac = (e.clientX - d.x0) / d.width;
    else { const now = Math.atan2(e.clientX - d.cx, d.cy - e.clientY); d.turned += angleDelta(d.prev, now); d.prev = now; frac = d.turned / (2 * Math.PI); }
    onChange(resizeWeights(d.ws, d.i, d.i, frac * d.ws.reduce((t, w) => t + w, 0), chosenIdx));
  };
  const end = () => { drag.current = null; };
  const key = (i, e) => {
    const step = { ArrowRight: 0.02, ArrowLeft: -0.02 }[e.key];
    if (!step) return;
    e.preventDefault();
    onStart();
    onChange(resizeWeights(ws, i, i, step * T, chosenIdx));
  };
  const segDown = (id, e) => { suppress.current = !!(e.ctrlKey || e.metaKey || e.shiftKey); if (suppress.current) onToggle(id); };
  const segClick = (id) => { if (suppress.current) { suppress.current = false; return; } onSelect && onSelect(id); };
  const segKey = (id, e) => { if (e.key === 'l' || e.key === 'L') { e.preventDefault(); onToggle(id); } };
  const label = (x) => `${x.label}: ${pct(x.w, T)}%. Ctrl or ⌘-click, or L, to choose it to absorb resizes.`;
  const status = html`<div class="estatus">
    ${chosen.length ? html`<span>${chosen.length} chosen · a resize takes from or gives to only those</span><button type="button" class="btn small" onClick=${onClear}>Clear</button>`
      : html`<span>Drag ${mode === 'bar' ? 'a divider' : 'a ⇔ handle'} to resize · Ctrl or ⌘-click to choose what a resize changes</span>`}
  </div>`;
  if (!items.length) return html`<p class="note">Nothing to weigh.</p>`;
  if (mode === 'bar') {
    return html`<div>
      <div class="wbar" ref=${box} style=${{ height }}>
        ${items.map((x, i) => html`<${React.Fragment} key=${x.id}>
          <button type="button" class=${'wseg' + (chosen.includes(x.id) ? ' chosen' : '') + (selected === x.id ? ' sel' : '')} style=${{ flex: `${x.w} 1 0`, background: colorOf(x, i) }}
            aria-label=${label(x)} aria-pressed=${String(chosen.includes(x.id))} title=${x.label}
            onPointerDown=${(e) => segDown(x.id, e)} onClick=${() => segClick(x.id)} onKeyDown=${(e) => segKey(x.id, e)} onContextMenu=${(e) => e.ctrlKey && e.preventDefault()}>
            <b>${x.label}</b><span class="mono">${pct(x.w, T)}%</span>
          </button>
          ${i < items.length - 1 && html`<div class="wdiv" role="separator" tabIndex="0" aria-label=${`Resize ${x.label} against ${items[i + 1].label}`}
            onPointerDown=${(e) => start(i, e)} onPointerMove=${move} onPointerUp=${end} onPointerCancel=${end} onKeyDown=${(e) => key(i, e)}></div>`}
        <//>`)}
      </div>${status}
    </div>`;
  }
  let a = 0;
  const arcs = items.map((x, i) => { const a0 = a; a += (x.w / T) * 2 * Math.PI; return { x, i, a0, a1: a }; });
  return html`<div>
    <div class="pie" ref=${box}>
      <svg viewBox="-12 -12 224 224" role="group" aria-label="Weights">
        <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="6" style=${{ fill: 'var(--ink)', opacity: 0.3 }}></rect></pattern></defs>
        ${arcs.map(({ x, i, a0, a1 }) => {
          const on = chosen.includes(x.id);
          const d = arcPath(46, 98, a0, a1);
          const [lx, ly] = polar(72, (a0 + a1) / 2);
          return html`<g key=${x.id}>
            <path d=${d} class=${'slice' + (selected === x.id ? ' sel' : '')} tabIndex="0" role="button" aria-label=${label(x)} aria-pressed=${String(on)}
              style=${{ fill: colorOf(x, i), strokeDasharray: on ? '4 3' : 'none', stroke: on ? 'var(--ink)' : selected === x.id ? 'var(--ink)' : 'var(--card)', strokeWidth: on || selected === x.id ? 2 : 1.2 }}
              onPointerDown=${(e) => segDown(x.id, e)} onClick=${() => segClick(x.id)} onKeyDown=${(e) => segKey(x.id, e)} onContextMenu=${(e) => e.ctrlKey && e.preventDefault()}><title>${x.label}</title></path>
            ${on && html`<path d=${d} style=${{ fill: 'url(#hatch)', pointerEvents: 'none' }}></path>`}
            ${a1 - a0 > 0.45 && html`<text x=${lx} y=${ly - 4} class="plabel">${x.label.length > 14 ? x.label.slice(0, 13) + '…' : x.label}</text>`}
            ${a1 - a0 > 0.3 && html`<text x=${lx} y=${ly + 9} class="plabel mono">${pct(x.w, T)}%</text>`}
          </g>`;
        })}
        ${arcs.slice(0, -1).map(({ x, i, a1 }) => {
          const [hx, hy] = polar(108, a1);
          const rot = (a1 * 180) / Math.PI;
          return html`<g key=${'h' + x.id} class="handle" transform=${`translate(${hx} ${hy})`} tabIndex="0" role="separator" aria-label=${`Resize ${x.label} against ${items[i + 1].label}`}
            onPointerDown=${(e) => start(i, e)} onPointerMove=${move} onPointerUp=${end} onPointerCancel=${end} onKeyDown=${(e) => key(i, e)}>
            <circle r="8.5"></circle><path d="M-4 0H4M-4 0l2-2M-4 0l2 2M4 0l-2-2M4 0l-2 2" transform=${`rotate(${rot})`}></path>
          </g>`;
        })}
      </svg>
    </div>${status}
  </div>`;
}

function App() {
  const [st, setSt] = useState({
    people: { you: clone(youRecord), sam: clone(samRecord) }, pool: clone(OPTIONS),
    active: 'you', view: 'overall', goal: 'rel', cell: { opt: 'esdb', crit: 'ops' }, whatIf: null,
    mode: 'bar', chosen: {},
    snapshots: [{ id: 'snap0', owner: 'you', name: 'Before the cost review', at: 'Oct 28', rec: clone(youRecord) }],
    cmpA: 'you', cmpB: 'sam', cmpTier: 'goals', cmpGoal: 'rel', cmpRow: null, cmpStyle: 'side',
  });
  const stRef = useRef(st);
  stRef.current = st;
  const hist = useRef({ past: [], future: [] });
  const [, bump] = useState(0);
  const checkpoint = () => { hist.current.past.push(stRef.current); hist.current.future = []; bump((n) => n + 1); };
  const live = (fn) => setSt((s) => fn(s));
  const commit = (fn) => { checkpoint(); live(fn); };
  const undo = () => { const h = hist.current; if (!h.past.length) return; h.future.push(stRef.current); setSt(h.past.pop()); };
  const redo = () => { const h = hist.current; if (!h.future.length) return; h.past.push(stRef.current); setSt(h.future.pop()); };
  useEffect(() => {
    const onKey = (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
      if (e.target.matches('input[type=text], input:not([type]), textarea')) return;
      e.preventDefault();
      e.shiftKey ? redo() : undo();
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, []);

  const rec = st.people[st.active];
  const editRec = (fn, isLive) => (isLive ? live : commit)((s) => {
    const r = clone(s.people[s.active]);
    fn(r);
    return { ...s, people: { ...s.people, [s.active]: r } };
  });
  const editGoal = (gid, fn, isLive) => editRec((r) => fn(r.goals.find((g) => g.id === gid), r), isLive);
  const go = (patch) => setSt((s) => ({ ...s, ...patch }));
  const colorOfGoal = (gid) => GOAL_COLORS[rec.goals.findIndex((g) => g.id === gid) % GOAL_COLORS.length];
  const choose = (scope) => ({
    chosen: st.chosen[scope] || [],
    onToggle: (id) => commit((s) => { const c = s.chosen[scope] || []; return { ...s, chosen: { ...s.chosen, [scope]: c.includes(id) ? c.filter((x) => x !== id) : [...c, id] } }; }),
    onClear: () => commit((s) => ({ ...s, chosen: { ...s.chosen, [scope]: [] } })),
  });
  const modeSwitch = html`<div class="seg" role="group" aria-label="Chart">
    ${[['bar', 'Bar'], ['pie', 'Pie']].map(([m, l]) => html`<button key=${m} type="button" aria-pressed=${String(st.mode === m)} onClick=${() => go({ mode: m })}>${l}</button>`)}
  </div>`;
  const ctx = { rec, st, live, commit, checkpoint, editRec, editGoal, colorOfGoal, go, choose, modeSwitch };

  const header = html`<header class="top">
    <div class="brand">Event store for the billing service<small>decision record · billing-event-store.md</small></div>
    <nav class="tabs" aria-label="Views">
      ${[['overall', 'Overall'], ['goals', 'Goals'], ['compare', 'Compare']].map(([v, l]) => html`<button key=${v} type="button" aria-pressed=${String(st.view === v || (v === 'goals' && st.view === 'goal'))} onClick=${() => go({ view: v })}>${l}</button>`)}
    </nav>
    <div class="seg" role="group" aria-label="Whose record">
      ${[['you', 'You'], ['sam', 'Sam']].map(([p, l]) => html`<button key=${p} type="button" aria-pressed=${String(st.active === p)} onClick=${() => go({ active: p, whatIf: null })}>${l}</button>`)}
    </div>
    <button type="button" class="icon" title="Undo (⌘Z)" aria-label="Undo" disabled=${!hist.current.past.length} onClick=${undo}>↶</button>
    <button type="button" class="icon" title="Redo (⌘⇧Z)" aria-label="Redo" disabled=${!hist.current.future.length} onClick=${redo}>↷</button>
  </header>`;

  let body;
  if (st.view === 'overall') body = html`<${Overall} ...${ctx} />`;
  else if (st.view === 'goals') body = html`<${Goals} ...${ctx} />`;
  else if (st.view === 'goal') body = html`<${GoalView} ...${ctx} />`;
  else body = html`<${Compare} ...${ctx} />`;
  return html`${header}<main>${body}</main>`;
}

const weightsOf = (r) => JSON.stringify(r.goals.map((g) => [g.imp, g.criteria.map((c) => c.w)]));

function Overall({ rec, st, live, commit, checkpoint, colorOfGoal, go, choose, modeSwitch }) {
  const work = st.whatIf ?? rec;
  const [snapName, setSnapName] = useState('');
  const setWork = (fn, isLive) => (isLive ? live : commit)((s) => { const w = clone(s.whatIf ?? s.people[s.active]); fn(w); return { ...s, whatIf: w }; });
  const weights = Object.fromEntries(work.goals.map((g) => [g.id, g.imp]));
  const ranking = overall(work, weights);
  const T = work.goals.reduce((t, g) => t + g.imp, 0);
  const winners = Object.fromEntries(work.goals.map((g) => [g.id, goalWinner(g)]));
  const dirty = st.whatIf !== null && weightsOf(st.whatIf) !== weightsOf(rec);
  const on = work.goals.filter((g) => g.imp > 0);
  const sg = work.goals.find((g) => g.id === st.goal) ?? work.goals[0];
  const mine = st.snapshots.filter((x) => x.owner === st.active);
  return html`
    <section>
      <p class="lbl">Overall ranking · ${st.active === 'you' ? 'your record' : 'Sam’s record'}</p>
      <h1>Which option comes out ahead across every goal?</h1>
      <p class="sub">Each option’s goal scores, weighted by goal importance. An option a goal doesn’t consider scores zero for that goal.</p>
    </section>
    <div class="row">
      <div class="card grow">
        <div class="hrow"><h2>Goal weights</h2>${modeSwitch}</div>
        <p class="note">${dirty ? html`<span class="changed">What-if weights.</span> Temporary until you save them.` : 'Changes here are temporary until you save them.'}</p>
        <ul class="goallist">
          ${work.goals.map((g) => html`<li key=${g.id}>
            <input type="checkbox" checked=${g.imp > 0} aria-label=${`Include ${g.title}`} onChange=${(e) => setWork((w) => { w.goals.find((x) => x.id === g.id).imp = e.target.checked ? (rec.goals.find((x) => x.id === g.id).imp || 20) : 0; })} />
            <button type="button" class=${'gname' + (sg.id === g.id ? ' on' : '')} aria-pressed=${String(sg.id === g.id)} onClick=${() => go({ goal: g.id })}>
              <i style=${{ background: colorOfGoal(g.id) }}></i>${g.title}</button>
            <span class="mono note">${pct(g.imp, T)}%</span>
          </li>`)}
        </ul>
        <${WeightEditor} mode=${st.mode} items=${on.map((g) => ({ id: g.id, label: g.title, w: g.imp }))} colorOf=${(x) => colorOfGoal(x.id)} selected=${sg.id}
          ...${choose('goals')} onSelect=${(id) => go({ goal: id })} onStart=${checkpoint}
          onChange=${(nws) => setWork((w) => on.forEach((g, i) => { w.goals.find((x) => x.id === g.id).imp = nws[i]; }), true)} />
        <div class="sep"></div>
        <div class="hrow"><h2>Criteria · ${sg.title}</h2>${sg.imp === 0 && html`<span class="chip plain">Goal is off</span>`}</div>
        <${WeightEditor} mode=${st.mode} height=${64} items=${sg.criteria.map((c) => ({ id: c.id, label: c.title, w: c.w }))} colorOf=${(x, i) => CRIT_COLORS[i % CRIT_COLORS.length]}
          ...${choose('crit:' + sg.id)} onStart=${checkpoint}
          onChange=${(nws) => setWork((w) => w.goals.find((x) => x.id === sg.id).criteria.forEach((c, i) => { c.w = nws[i]; }), true)} />
        <div class="actions">
          <button type="button" class="btn" disabled=${!dirty} onClick=${() => commit((s) => ({ ...s, whatIf: null }))}>Reset</button>
          <button type="button" class="btn primary" disabled=${!dirty} onClick=${() => commit((s) => ({ ...s, whatIf: null, people: { ...s.people, [s.active]: s.whatIf } }))}>Save as the record’s weights</button>
        </div>
        <form class="snapform" onSubmit=${(e) => {
          e.preventDefault();
          const name = snapName.trim();
          if (!name) return;
          commit((s) => ({ ...s, snapshots: [...s.snapshots, { id: newId('snap'), owner: s.active, name, at: 'Just now', rec: clone(s.whatIf ?? s.people[s.active]) }] }));
          setSnapName('');
        }}>
          <input class="field" placeholder="Snapshot name, e.g. Without replay" aria-label="Snapshot name" value=${snapName} onChange=${(e) => setSnapName(e.target.value)} />
          <button type="submit" class="btn" disabled=${!snapName.trim()}>Save snapshot</button>
        </form>
        ${mine.length > 0 && html`<div class="snaps"><span class="lbl">Snapshots</span>
          ${mine.map((x) => html`<span key=${x.id} class="chip plain snap">
            <button type="button" class="x" title="Load these weights as what-if weights" onClick=${() => commit((s) => ({ ...s, whatIf: clone(x.rec) }))}>${x.name} · ${x.at}</button>
            <button type="button" class="x" aria-label=${`Delete snapshot ${x.name}`} onClick=${() => commit((s) => ({ ...s, snapshots: s.snapshots.filter((k) => k.id !== x.id), cmpA: s.cmpA === x.id ? 'you' : s.cmpA, cmpB: s.cmpB === x.id ? 'sam' : s.cmpB }))}>×</button>
          </span>`)}</div>`}
      </div>
      <div class="card grow">
        <div class="legend">${work.goals.filter((g) => g.imp > 0).map((g) => html`<span key=${g.id}><i style=${{ background: colorOfGoal(g.id) }}></i>${g.title}</span>`)}</div>
        <div style=${{ marginTop: 8 }}>
          ${ranking.map((r, i) => {
            const wins = work.goals.filter((g) => winners[g.id] === r.id && g.imp > 0);
            return html`<div class="rank" key=${r.id}>
              <span class="pos">${i + 1}</span>
              <div class="nm">${optName(r.id, st.pool)}
                <div class="chips">${wins.length ? wins.map((g) => html`<span key=${g.id} class="chip win">Wins ${g.title}</span>`) : i === 0 ? html`<span class="chip warn">Wins no single goal</span>` : null}</div>
              </div>
              <div class="stack" title=${r.parts.map((p) => `${work.goals.find((g) => g.id === p.goal).title}: +${fmt(p.v)}`).join('\n')}>
                ${r.parts.map((p) => html`<i key=${p.goal} style=${{ width: `${(p.v / 10) * 100}%`, background: colorOfGoal(p.goal) }}></i>`)}
              </div>
              <span class="tot2">${fmt(r.total)}</span>
            </div>`;
          })}
        </div>
        <p class="note" style=${{ marginBottom: 0 }}>Scores are out of 10. Each coloured segment is what that goal adds.</p>
      </div>
    </div>`;
}

  const [newReason, setNewReason] = useState('');

  const winner = goalWinner(g);
  const W = g.criteria.reduce((t, c) => t + c.w, 0);
  const ranked = [...g.options].sort((a, b) => s[b] - s[a]);
  const cell = st.cell && g.options.includes(st.cell.opt) && g.criteria.some((c) => c.id === st.cell.crit) ? st.cell : null;
  const rkey = cell && `${g.id}|${cell.opt}|${cell.crit}`;

        ${g.criteria.map((c) => html`<span key=${c.id} class="chip plain" style=${{ padding: '2px 4px 2px 6px' }}>
          <input class="in" style=${{ width: `${Math.max(8, c.title.length + 1)}ch`, fontWeight: 600 }} aria-label="Criterion title" value=${c.title} onFocus=${checkpoint} onChange=${(e) => editGoal(g.id, (x) => { x.criteria.find((k) => k.id === c.id).title = e.target.value; }, true)} />
          <button type="button" class="x" aria-label=${`Remove ${c.title}`} onClick=${() => editGoal(g.id, (x) => { x.criteria = x.criteria.filter((k) => k.id !== c.id); })}>×</button>
        </span>`)}
        <button type="button" class="ghost" onClick=${() => editGoal(g.id, (x) => x.criteria.push({ id: newId('c'), title: 'New criterion', w: Math.round(W / Math.max(1, x.criteria.length)) || 50 }))}>+ Criterion</button>
      </div>
    </div>
    <div class="row">
      <div class="card grow">
        <h2>Options and scores</h2>
        <p class="note" style=${{ margin: '0 0 8px' }}>Score each option 0–10 on each criterion. Click a score to change it and give reasons.</p>
        <div class="gridwrap">
          <table>
            <thead><tr><th></th>${g.criteria.map((c) => html`<th key=${c.id}>${c.title}<span class="w mono">${pct(c.w, W)}%</span></th>`)}<th style=${{ textAlign: 'right' }}>Goal score</th></tr></thead>
            <tbody>
              ${ranked.map((o) => html`<tr key=${o}>
                <td class="opt">${optName(o, st.pool)} ${o === winner && html`<span class="chip win">Winner</span>`}
                  <button type="button" class="x" aria-label=${`Remove ${optName(o, st.pool)} from this goal`} onClick=${() => editGoal(g.id, (x) => { x.options = x.options.filter((k) => k !== o); })}>×</button></td>
                ${g.criteria.map((c) => {
                  const n = g.scores[o]?.[c.id] ?? 0;
                  const rc = (rec.reasons[`${g.id}|${o}|${c.id}`] || []).length;
                  const on = cell && cell.opt === o && cell.crit === c.id;
                  return html`<td key=${c.id}><button type="button" class="cell" aria-pressed=${String(!!on)} style=${{ background: scoreBg(n), color: scoreFg(n) }} onClick=${() => go({ cell: { opt: o, crit: c.id } })} aria-label=${`${optName(o, st.pool)}, ${c.title}: ${n} out of 10, ${rc} reasons`}>
                    <span class="n">${n}</span><span class="r">${rc ? `${rc} reason${rc > 1 ? 's' : ''}` : '—'}</span></button></td>`;
                })}
                <td class="tot">${fmt(s[o])}</td>
              </tr>`)}
            </tbody>
          </table>
        </div>
        <div style=${{ display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap', alignItems: 'center' }}>
          <select class="field" aria-label="Add an existing option" value="" onChange=${(e) => addOption(e.target.value)}>
            <option value="">+ Add an existing option…</option>
            ${available.map((o) => html`<option key=${o.id} value=${`pool:${o.id}`}>${o.name}</option>`)}
          </select>
          <form style=${{ display: 'flex', gap: 6 }} onSubmit=${(e) => {
            e.preventDefault();
            const name = newOpt.trim();
            if (!name) return;
            const id = newId('o');
            commit((s0) => {
              const r = clone(s0.people[s0.active]);
              r.goals.find((x) => x.id === g.id).options.push(id);
              return { ...s0, pool: [...s0.pool, { id, name }], people: { ...s0.people, [s0.active]: r } };
            });
            setNewOpt('');
          }}>
            <input class="field" placeholder="or a new option" aria-label="New option name" value=${newOpt} onChange=${(e) => setNewOpt(e.target.value)} />
            <button class="btn" type="submit" disabled=${!newOpt.trim()}>Add</button>
          </form>
        </div>
      </div>
      <div class="card side">
        ${cell ? html`
          <p class="lbl">Score</p>
          <h2>${optName(cell.opt, st.pool)} · ${g.criteria.find((c) => c.id === cell.crit).title}</h2>
          <div style=${{ display: 'flex', gap: 10, alignItems: 'center', margin: '8px 0 4px' }}>
            <input type="range" min="0" max="10" step="1" style=${{ flex: 1 }} aria-label="Score" value=${g.scores[cell.opt]?.[cell.crit] ?? 0}
              onPointerDown=${checkpoint} onKeyDown=${checkpoint}
              onChange=${(e) => editGoal(g.id, (x) => { x.scores[cell.opt] = { ...(x.scores[cell.opt] || {}), [cell.crit]: +e.target.value }; }, true)} />
            <span class="mono" style=${{ fontSize: 22, fontWeight: 500, width: '3ch', textAlign: 'right' }}>${g.scores[cell.opt]?.[cell.crit] ?? 0}</span>
          </div>
          <p class="lbl" style=${{ marginTop: 16 }}>Reasons</p>
          ${reasons.length ? html`<ul class="reasons">${reasons.map((t, i) => html`<li key=${i}><span>${t}</span><button type="button" class="x" aria-label="Remove reason" onClick=${() => editRec((r) => { r.reasons[rkey] = r.reasons[rkey].filter((_, j) => j !== i); })}>×</button></li>`)}</ul>`
            : html`<p class="note">No reasons yet. A score can have none, one or many.</p>`}
          <form style=${{ display: 'flex', gap: 6, marginTop: 10 }} onSubmit=${(e) => {
            e.preventDefault();
            const t = newReason.trim();
            if (!t) return;
            editRec((r) => { r.reasons[rkey] = [...(r.reasons[rkey] || []), t]; });
            setNewReason('');
          }}>
            <input class="field" style=${{ flex: 1, minWidth: 0 }} placeholder="Add a reason" aria-label="New reason" value=${newReason} onChange=${(e) => setNewReason(e.target.value)} />
            <button class="btn" type="submit" disabled=${!newReason.trim()}>Add</button>
          </form>
        ` : html`<p class="note">Click a score to change it and see its reasons.</p>`}
      </div>
    </div>`;
}

// Compare: two records (people or snapshots), tier by tier, biggest differences first.
function Compare({ st, go, colorOfGoal }) {
  const sources = [
    { key: 'you', name: 'You', rec: st.people.you },
    { key: 'sam', name: 'Sam', rec: st.people.sam },
    ...st.snapshots.map((x) => ({ key: x.id, name: `${x.owner === 'you' ? 'You' : 'Sam'} · ${x.name}`, rec: x.rec })),
  ];
  const A = sources.find((x) => x.key === st.cmpA) ?? sources[0];
  const B = sources.find((x) => x.key === st.cmpB) ?? sources[1];
  const a = A.rec; const b = B.rec;
  const gOf = (r, id) => r.goals.find((g) => g.id === id);
  const share = (items, id) => { const T = items.reduce((t, x) => t + x.w, 0); const x = items.find((k) => k.id === id); return x && T ? x.w / T : 0; };
  const goalItems = (r) => r.goals.map((g) => ({ id: g.id, w: g.imp, label: g.title }));
  const critItems = (r, gid) => (gOf(r, gid)?.criteria || []).map((c) => ({ id: c.id, w: c.w, label: c.title }));
  const rowsFor = (tier, gid) => {
    if (tier === 'goals') {
      const ids = [...new Set([...a.goals, ...b.goals].map((g) => g.id))];
      return ids.map((id) => ({ id, label: (gOf(a, id) || gOf(b, id)).title, a: share(goalItems(a), id) * 100, b: share(goalItems(b), id) * 100, unit: '%', max: 100 }));
    }
    const ga = gOf(a, gid); const gb = gOf(b, gid);
    if (tier === 'criteria') {
      const all = [...critItems(a, gid), ...critItems(b, gid)];
      return [...new Set(all.map((c) => c.id))].map((id) => ({ id, label: all.find((c) => c.id === id).label, a: share(critItems(a, gid), id) * 100, b: share(critItems(b, gid), id) * 100, unit: '%', max: 100 }));
    }
    const out = [];
    for (const o of [...new Set([...(ga?.options || []), ...(gb?.options || [])])]) {
      for (const c of ga?.criteria || []) out.push({ id: `${o}|${c.id}`, label: optName(o, st.pool), sub: c.title, a: ga?.scores[o]?.[c.id] ?? 0, b: gb?.scores[o]?.[c.id] ?? 0, unit: '', max: 10, key: `${gid}|${o}|${c.id}` });
    }
    return out;
  };
  const withGap = (rs) => rs.map((r) => ({ ...r, gap: Math.abs(r.a - r.b) / r.max })).sort((x, y) => y.gap - x.gap);
  const rows = withGap(rowsFor(st.cmpTier, st.cmpGoal));
  const top = withGap([
    ...rowsFor('goals').map((r) => ({ ...r, tier: 'goals', where: 'Goal importance' })),
    ...a.goals.flatMap((g) => rowsFor('criteria', g.id).map((r) => ({ ...r, tier: 'criteria', goal: g.id, where: `${g.title} · criterion weight` }))),
    ...a.goals.flatMap((g) => rowsFor('scores', g.id).map((r) => ({ ...r, tier: 'scores', goal: g.id, where: `${g.title} · score` }))),
  ]).filter((r) => r.gap > 0).slice(0, 4);
  const sel = rows.find((r) => r.id === st.cmpRow);
  const show = (v, r) => (r.unit === '%' ? `${Math.round(v)}%` : `${v}`);
  const pick = (which) => html`<select class="field" aria-label=${which === 'cmpA' ? 'First record' : 'Second record'} value=${st[which]} onChange=${(e) => go({ [which]: e.target.value, cmpRow: null })}>
    ${sources.map((x) => html`<option key=${x.key} value=${x.key}>${x.name}</option>`)}</select>`;
  const goalSel = st.cmpTier !== 'goals' && html`<select class="field" aria-label="Goal" value=${st.cmpGoal} onChange=${(e) => go({ cmpGoal: e.target.value, cmpRow: null })}>
    ${a.goals.map((g) => html`<option key=${g.id} value=${g.id}>${g.title}</option>`)}</select>`;

  // Composite: each record's whole bar, split into its parts.
  const compBar = (items, colorFor, scale) => {
    const T = items.reduce((t, x) => t + x.w, 0) || 1;
    return html`<div class="comp">${items.filter((x) => x.w > 0).map((x, i) => html`<i key=${x.id} title=${`${x.label}: ${scale ? fmt(x.w) : pct(x.w, T) + '%'}`}
      style=${{ width: `${scale ? (x.w / scale) * 100 : (x.w / T) * 100}%`, background: colorFor(x, i) }}>${(scale ? x.w / scale : x.w / T) > 0.12 ? html`<span>${x.label}${scale ? '' : ` ${pct(x.w, T)}%`}</span>` : ''}</i>`)}</div>`;
  };
  const allCrit = [...new Set([...critItems(a, st.cmpGoal), ...critItems(b, st.cmpGoal)].map((c) => c.id))];
  const critColor = (x) => CRIT_COLORS[Math.max(0, allCrit.indexOf(x.id)) % CRIT_COLORS.length];
  const goalColor = (x) => colorOfGoal(x.id);
  let composite = null;
  if (st.cmpStyle === 'composite') {
    if (st.cmpTier !== 'scores') {
      const itemsOf = (r) => (st.cmpTier === 'goals' ? goalItems(r) : critItems(r, st.cmpGoal));
      const color = st.cmpTier === 'goals' ? goalColor : critColor;
      composite = html`<div class="comprows">${[A, B].map((s) => html`<div key=${s.key} class="comprow"><span class="who">${s.name}</span>${compBar(itemsOf(s.rec), color)}</div>`)}</div>`;
    } else {
      const ga = gOf(a, st.cmpGoal); const gb = gOf(b, st.cmpGoal);
      const parts = (g, o) => { if (!g || !g.options.includes(o)) return []; const W = g.criteria.reduce((t, c) => t + c.w, 0) || 1; return g.criteria.map((c) => ({ id: c.id, label: c.title, w: (c.w / W) * (g.scores[o]?.[c.id] ?? 0) })); };
      const opts = [...new Set([...(ga?.options || []), ...(gb?.options || [])])];
      composite = html`<div class="comprows">${opts.map((o) => html`<div key=${o} class="compopt">
        <b>${optName(o, st.pool)}</b>
        ${[[A, ga], [B, gb]].map(([s, g]) => { const ps = parts(g, o); const t = ps.reduce((x, p) => x + p.w, 0); return html`<div key=${s.key} class="comprow"><span class="who">${s.name}</span>${compBar(ps, critColor, 10)}<span class="mono">${fmt(t)}</span></div>`; })}
      </div>`)}</div>`;
    }
  }
  const legendItems = st.cmpTier === 'goals' ? [...new Set([...a.goals, ...b.goals].map((g) => g.id))].map((id) => ({ id, label: (gOf(a, id) || gOf(b, id)).title, color: colorOfGoal(id) }))
    : allCrit.map((id) => ({ id, label: [...critItems(a, st.cmpGoal), ...critItems(b, st.cmpGoal)].find((c) => c.id === id).label, color: critColor({ id }) }));
  return html`
    <section>
      <p class="lbl">Compare</p>
      <h1>Where do ${A.name} and ${B.name} differ?</h1>
      <p class="sub">Compare two people, or any saved snapshots, goal by goal, criterion by criterion and score by score.</p>
      <div class="pickers">${pick('cmpA')}<span class="note">with</span>${pick('cmpB')}</div>
    </section>
    <div class="row">
      ${top.length ? top.map((r) => html`<button type="button" key=${r.where + r.id} class="card" style=${{ flex: '1 1 220px', textAlign: 'left', padding: 14 }}
        onClick=${() => go({ cmpTier: r.tier, cmpGoal: r.goal || st.cmpGoal, cmpRow: r.id, cmpStyle: 'side' })}>
        <span class="lbl">${r.where}</span>
        <div style=${{ fontWeight: 600, margin: '4px 0' }}>${r.label}${r.sub ? html` · ${r.sub}` : ''}</div>
        <span class="mono">${A.name.split(' · ').pop()} ${show(r.a, r)} · ${B.name.split(' · ').pop()} ${show(r.b, r)}</span>
      </button>`) : html`<p class="note">These two records are the same.</p>`}
    </div>
    <div class="row">
      <div class="card grow">
        <div class="hrow" style=${{ marginBottom: 12 }}>
          <div class="seg" role="group" aria-label="What to compare">
            ${[['goals', 'Goals'], ['criteria', 'Criteria'], ['scores', 'Scores']].map(([t, l]) => html`<button key=${t} type="button" aria-pressed=${String(st.cmpTier === t)} onClick=${() => go({ cmpTier: t, cmpRow: null })}>${l}</button>`)}
          </div>
          ${goalSel}
          <div class="seg" role="group" aria-label="Bar style" style=${{ marginLeft: 'auto' }}>
            ${[['side', 'Side by side'], ['composite', 'Composite']].map(([t, l]) => html`<button key=${t} type="button" aria-pressed=${String(st.cmpStyle === t)} onClick=${() => go({ cmpStyle: t })}>${l}</button>`)}
          </div>
        </div>
        ${st.cmpStyle === 'composite' ? html`
          <div class="legend" style=${{ marginBottom: 10 }}>${legendItems.map((x) => html`<span key=${x.id}><i style=${{ background: x.color }}></i>${x.label}</span>`)}</div>
          ${composite}
          <p class="note">${st.cmpTier === 'scores' ? 'Each bar is the option’s goal score out of 10, split by what each criterion adds.' : 'Each bar is the whole, split by relative weight.'}</p>`
        : html`
          <div class="legend" style=${{ marginBottom: 6 }}><span><i style=${{ background: 'var(--ink)' }}></i>${A.name}</span><span><i style=${{ background: 'var(--sam)' }}></i>${B.name}</span></div>
          <div class="cmp">
            ${rows.map((r) => html`<${React.Fragment} key=${r.id}>
              <button type="button" class=${'it' + (st.cmpRow === r.id ? ' sel' : '')} onClick=${() => go({ cmpRow: r.id })}>${r.label}${r.sub && html`<small>${r.sub}</small>`}</button>
              <div class="bars" title=${`${A.name} ${show(r.a, r)}, ${B.name} ${show(r.b, r)}`}>
                <div style=${{ width: `${(r.a / r.max) * 100}%`, background: 'var(--ink)' }}></div>
                <div style=${{ width: `${(r.b / r.max) * 100}%`, background: 'var(--sam)' }}></div>
              </div>
              <div class="gap">${r.gap >= 0.15 ? html`<span class="chip warn">${r.unit === '%' ? `${Math.round(Math.abs(r.a - r.b))} pts` : `${Math.abs(r.a - r.b)} apart`}</span>` : html`<span class="note mono">${r.unit === '%' ? Math.round(Math.abs(r.a - r.b)) : Math.abs(r.a - r.b)}</span>`}</div>
            <//>`)}
          </div>`}
      </div>
      <div class="card side">
        ${sel && st.cmpTier === 'scores' ? html`
          <p class="lbl">Why the scores differ</p>
          <h2>${sel.label} · ${sel.sub}</h2>
          <div class="two" style=${{ marginTop: 10 }}>
            ${[[A, sel.a], [B, sel.b]].map(([s, v]) => html`<div key=${s.key}>
              <div style=${{ fontWeight: 600 }}>${s.name} <span class="mono">${v}/10</span></div>
              ${((s.rec.reasons || {})[sel.key] || []).length ? html`<ul class="reasons">${s.rec.reasons[sel.key].map((t, i) => html`<li key=${i}><span>${t}</span></li>`)}</ul>` : html`<p class="note">No reasons given.</p>`}
            </div>`)}
          </div>` : html`<p class="lbl">Details</p><p class="note">${st.cmpTier === 'scores' && st.cmpStyle === 'side' ? 'Click a row to see the reasons behind each score.' : 'In Scores, side by side, click a row to see the reasons behind each score.'}</p>`}
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>
